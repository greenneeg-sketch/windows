<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>유리창 관리</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Jua&family=Gowun+Batang:wght@400;700&family=Gamja+Flower&family=Hi+Melody&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#14161F;color:#F4F1EA;font-family:'Noto Sans KR',system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}
  button,input{font-family:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid #FFC94D;outline-offset:2px}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font-family:'Nanum Pen Script',cursive;font-weight:400;font-size:44px;line-height:1}
  .muted{color:#BDB8AD;font-size:13px;margin:0}
  .card{background:#1D202C;border:1px solid #2C3040;border-radius:16px;padding:16px}
  #login{display:flex;flex-direction:column;gap:12px;max-width:420px}
  #login label{font-size:14px}
  #key{height:48px;border-radius:12px;border:1px solid #3A3F52;background:#262A38;color:#F4F1EA;padding:0 14px;font-size:16px}
  .btn{height:44px;padding:0 16px;border:0;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
  .primary{background:#FFC94D;color:#1A1712}
  .ghost{background:#2A2E3C;color:#F4F1EA}
  .danger{background:#3A2228;color:#FFB4A8}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stat{background:#1D202C;border:1px solid #2C3040;border-radius:14px;padding:12px}
  .stat b{display:block;font-size:26px}
  .stat span{font-size:12px;color:#BDB8AD}
  .tabs{display:flex;gap:6px;background:#1D202C;border-radius:14px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
  .tabs button{height:40px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:#BDB8AD;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer}
  .tabs button.on{background:#F4F1EA;color:#1A1712}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .item{background:#1D202C;border:1px solid #2C3040;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .item canvas{width:100%;aspect-ratio:1;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
  .meta{font-size:12.5px;color:#D9D4C9;display:flex;flex-wrap:wrap;gap:4px 10px}
  .tag{display:inline-block;padding:2px 8px;border-radius:8px;background:#3A2228;color:#FFB4A8;font-size:12px;font-weight:700}
  .tag.ok{background:#22352A;color:#A6E3B8}
  .row{display:flex;gap:8px}
  .row .btn{flex:1;height:40px;padding:0 8px;white-space:nowrap}
  #empty{padding:40px 0;text-align:center}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#2A2E3C;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
  @media (max-width:520px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
    <div><h1>유리창 관리</h1><p class="muted">신고된 포스트잇을 확인하고 숨기거나 되살려요</p></div>
    <button class="btn ghost" id="logout" hidden>나가기</button>
  </div>

  <form class="card" id="login">
    <label for="key">관리자 키</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="yc-로 시작하는 키">
    <button class="btn primary" type="submit">들어가기</button>
    <p class="muted" id="loginMsg"></p>
  </form>

  <div id="panel" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button data-f="reported" class="on">신고됨</button>
      <button data-f="hidden">숨겨짐</button>
      <button data-f="recent">최근 전체</button>
    </div>
    <div class="grid" id="list"></div>
    <p class="muted" id="empty" hidden></p>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var SB_URL = 'https://dhdmynqrbtiqbvmrvflz.supabase.co', SB_KEY = 'sb_publishable_ioOTpxXCCmi9dN83WMlKJw_8kjCJ8_t';
var WINDOWS = { mapo:'수고했어 창', busan:'털어놓는 창', gangneung:'다짐하는 창', jeju:'소원 창', newyear:'새해 소원 창' };
var CHEX = { y:'#FFE45C', p:'#FF9EC4', m:'#8FE3C4', b:'#8EC9FF', o:'#FFB067' };
var REASON = { abuse:'욕설·비하', spam:'광고·도배', privacy:'개인정보', sexual:'음란' };
var FONTS = { pen:['"Nanum Pen Script", cursive',1], gaegu:['"Gaegu", cursive',0.78], gamja:['"Gamja Flower", cursive',0.8], melody:['"Hi Melody", cursive',0.82], jua:['"Jua", sans-serif',0.7], batang:['"Gowun Batang", serif',0.66] };
var $ = function(id){ return document.getElementById(id); };
var key = ''; try{ key = sessionStorage.getItem('yc-admin') || ''; }catch(e){}
var filter = 'reported';

function toast(m){ var t=$('toast'); t.textContent=m; t.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(function(){ t.style.opacity=0; },1800); }
function rpc(fn, args){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn, {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(args)})
    .then(function(r){ return r.text().then(function(t){ var j=null; try{ j=t?JSON.parse(t):null; }catch(_){} if(!r.ok) throw new Error((j&&j.message)||('http_'+r.status)); return j; }); });
}

function draw(cv, n){
  var S = 360, x = cv.getContext('2d'); cv.width = S; cv.height = S;
  x.fillStyle = CHEX[n.c] || '#FFE45C'; x.fillRect(0,0,S,S);
  (n.strokes||[]).forEach(function(st){
    var p=st.p; if(!p||p.length<2) return;
    x.strokeStyle=st.c; x.fillStyle=st.c; x.lineWidth=st.w*S; x.lineCap='round'; x.lineJoin='round';
    if(p.length===2){ x.beginPath(); x.arc(p[0]*S,p[1]*S,st.w*S/2,0,Math.PI*2); x.fill(); return; }
    x.beginPath(); x.moveTo(p[0]*S,p[1]*S);
    for(var i=2;i<p.length-2;i+=2){ x.quadraticCurveTo(p[i]*S,p[i+1]*S,(p[i]+p[i+2])/2*S,(p[i+1]+p[i+3])/2*S); }
    x.lineTo(p[p.length-2]*S,p[p.length-1]*S); x.stroke();
  });
  (n.texts||[]).forEach(function(t){
    var f = FONTS[t.f||'pen'] || FONTS.pen;
    x.save(); x.translate(t.x*S, t.y*S); x.rotate(t.rot||0);
    x.font = (t.s*S*f[1])+'px '+f[0]; x.fillStyle=t.c; x.textAlign='center'; x.textBaseline='middle'; x.fillText(t.t,0,0); x.restore();
  });
}
function ago(iso){
  var m = Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<60) return m+'분 전'; if(m<1440) return Math.round(m/60)+'시간 전'; return Math.round(m/1440)+'일 전';
}

function loadStats(){
  return rpc('admin_stats', {p_key:key}).then(function(s){
    var box=$('stats'); box.innerHTML='';
    [['전체',s.total],['오늘',s.today],['신고 대기',s.reported],['숨김',s.hidden]].forEach(function(a){
      var d=document.createElement('div'); d.className='stat'; var b=document.createElement('b'); b.textContent=a[1]; var sp=document.createElement('span'); sp.textContent=a[0];
      d.appendChild(b); d.appendChild(sp); box.appendChild(d);
    });
  });
}
function loadList(){
  $('list').innerHTML=''; $('empty').hidden=true;
  return rpc('admin_list', {p_key:key, p_filter:filter}).then(function(rows){
    rows = rows || [];
    if(!rows.length){ $('empty').hidden=false; $('empty').textContent = filter==='reported' ? '처리할 신고가 없어요' : filter==='hidden' ? '숨겨진 포스트잇이 없어요' : '아직 포스트잇이 없어요'; return; }
    rows.forEach(function(n){
      var el=document.createElement('div'); el.className='item';
      var cv=document.createElement('canvas'); cv.setAttribute('role','img'); cv.setAttribute('aria-label', (n.texts||[]).map(function(t){return t.t;}).join(' ')||'그림 포스트잇'); draw(cv, n);
      var meta=document.createElement('div'); meta.className='meta';
      [WINDOWS[n.region]||n.region, n.place?n.place+'에서':'지역 없음', ago(n.created_at), '♥ '+n.hearts].forEach(function(t){ var s=document.createElement('span'); s.textContent=t; meta.appendChild(s); });
      var tags=document.createElement('div'); tags.className='meta';
      if(n.hidden){ var h=document.createElement('span'); h.className='tag'; h.textContent='숨김'; tags.appendChild(h); }
      Object.keys(n.reasons||{}).forEach(function(r){ var t=document.createElement('span'); t.className='tag'; t.textContent=(REASON[r]||r)+' '+n.reasons[r]; tags.appendChild(t); });
      if(!tags.children.length){ var ok=document.createElement('span'); ok.className='tag ok'; ok.textContent='신고 없음'; tags.appendChild(ok); }
      var row=document.createElement('div'); row.className='row';
      var tog=document.createElement('button'); tog.className='btn '+(n.hidden?'ghost':'primary'); tog.textContent = n.hidden ? '되살리기' : '숨기기';
      tog.addEventListener('click', function(){
        tog.disabled=true;
        rpc('admin_set_hidden', {p_key:key, p_id:n.id, p_hidden:!n.hidden}).then(function(){ toast(n.hidden?'되살렸어요 (신고 기록도 지웠어요)':'숨겼어요'); refresh(); }, function(e){ toast('실패: '+e.message); tog.disabled=false; });
      });
      var del=document.createElement('button'); del.className='btn danger'; del.textContent='삭제'; var armed=false;
      del.addEventListener('click', function(){
        if(!armed){ armed=true; del.textContent='한 번 더'; setTimeout(function(){ armed=false; del.textContent='삭제'; },2500); return; }
        del.disabled=true;
        rpc('admin_delete', {p_key:key, p_id:n.id}).then(function(){ toast('완전히 지웠어요'); refresh(); }, function(e){ toast('실패: '+e.message); del.disabled=false; });
      });
      row.appendChild(tog); row.appendChild(del);
      el.appendChild(cv); el.appendChild(meta); el.appendChild(tags); el.appendChild(row);
      $('list').appendChild(el);
    });
  });
}
function refresh(){ return Promise.all([loadStats(), loadList()]); }
function enter(){
  return loadStats().then(function(){
    try{ sessionStorage.setItem('yc-admin', key); }catch(e){}
    $('login').hidden=true; $('login').style.display='none'; $('panel').hidden=false; $('panel').style.display='flex'; $('logout').hidden=false;
    return loadList();
  });
}
$('login').addEventListener('submit', function(e){
  e.preventDefault(); key = $('key').value.trim(); $('loginMsg').textContent='확인 중…';
  enter().catch(function(err){ $('loginMsg').textContent = /not_admin/.test(err.message) ? '키가 맞지 않아요' : '서버에 연결할 수 없어요'; });
});
$('logout').addEventListener('click', function(){ try{ sessionStorage.removeItem('yc-admin'); }catch(e){} location.reload(); });
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
  b.addEventListener('click', function(){ filter=b.getAttribute('data-f'); Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.classList.toggle('on', x===b); }); loadList(); });
});
$('panel').style.display='none';
if(key){ enter().catch(function(){ try{ sessionStorage.removeItem('yc-admin'); }catch(e){} }); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!$('panel').hidden) loadList(); });
})();
</script>
</body>
</html>
