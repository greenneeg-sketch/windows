<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>유리창 — 3D 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Jua&family=Gowun+Batang:wght@400;700&family=Gamja+Flower&family=Hi+Melody&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f16;font-family:'Noto Sans KR',system-ui,sans-serif;color:#F4F1EA;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#c{display:block;width:100vw;height:100vh;touch-action:none}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid #FFC94D;outline-offset:2px}
  .glass{background:rgba(20,22,32,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
  #top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
  #top>*{pointer-events:auto}
  #topR{display:flex;gap:8px}
  #loc{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:22px;color:#F4F1EA;font-size:14px;text-align:left}
  #loc small{display:block;font-size:11px;color:#C9C4B8;font-weight:400}
  #loc b{font-weight:700}
  .iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#F4F1EA;font-size:12px;font-weight:700}
  .iconbtn.off{color:#8d8a84}
  #hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);padding:8px 14px;border-radius:16px;font-size:12.5px;color:#E6E1D6;white-space:nowrap;transition:opacity .6s;pointer-events:none}
  #joy{position:fixed;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:124px;height:124px;border-radius:50%;touch-action:none}
  #knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:none}
  #acts{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 104px);display:flex;gap:10px}
  .act{width:60px;height:60px;border-radius:30px;color:#F4F1EA;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
  .act.on{background:rgba(255,201,77,.35)}
  #add{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 30px);height:56px;padding:0 22px;border:0;border-radius:28px;background:#FFC94D;color:#1A1712;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  #place{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 176px);padding:10px 10px 10px 16px;border-radius:24px;font-size:14px;display:none;align-items:center;gap:10px;white-space:nowrap}
  #place button{height:36px;padding:0 14px;border-radius:18px;border:0;background:rgba(255,255,255,.16);color:#F4F1EA;font-size:13px}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;display:none}
  .scrim{position:fixed;inset:0;background:rgba(6,7,12,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .scrim.on{display:flex}
  .sheet{width:100%;max-width:460px;max-height:96vh;overflow-y:auto;background:#1D202C;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px}
  .sheet h2{margin:0;font-size:18px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .close{width:44px;height:44px;border-radius:22px;border:0;background:#2A2E3C;color:#F4F1EA;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .swatches{display:flex;gap:10px}
  .sw{width:40px;height:40px;border-radius:10px;border:3px solid transparent;padding:0}
  .sw.on{border-color:#F4F1EA}
  #edWrap{align-self:center;width:min(100%,360px);aspect-ratio:1;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  #ed{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:2px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seg{display:flex;background:#2A2E3C;border-radius:12px;padding:3px}
  .seg button{height:38px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#C9C4B8;font-size:14px;font-weight:700}
  .seg button.on{background:#F4F1EA;color:#1A1712}
  .ink{width:28px;height:28px;border-radius:14px;border:3px solid transparent;padding:0}
  .ink.on{border-color:#F4F1EA}
  .tbtn{height:38px;padding:0 12px;border:0;border-radius:10px;background:#2A2E3C;color:#F4F1EA;font-size:13px;display:flex;align-items:center;gap:4px}
  .tbtn:disabled{opacity:.4}
  #textRow{display:none;flex-direction:column;gap:8px}
  #textRow.on{display:flex}
  #textRow .seg{align-self:flex-start}
  .fonts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .fonts button{flex-shrink:0;height:40px;padding:0 12px;border-radius:10px;border:2px solid transparent;background:#2A2E3C;color:#F4F1EA;font-size:18px;white-space:nowrap}
  .fonts button.on{border-color:#FFC94D}
  #inl{position:absolute;z-index:2;transform-origin:50% 50%;min-width:80px;padding:2px 8px;border:2px dashed rgba(42,36,32,.6);border-radius:6px;background:rgba(255,255,255,.35);outline:none;text-align:center;-webkit-user-select:text;user-select:text}
    .muted{margin:0;font-size:12.5px;color:#BDB8AD}
  .primary{height:54px;border:0;border-radius:16px;background:#FFC94D;color:#1A1712;font-size:16px;font-weight:700;flex-shrink:0}
  .primary:disabled{opacity:.5}
  #readerScrim{align-items:center}
  #readerCard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  #readerNote{width:min(80vw,320px);aspect-ratio:1;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-2deg)}
  #readerNote canvas{width:100%;height:100%;display:block}
  #readerMeta{font-size:13px;color:#D9D4C9}
  .pillrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pill{height:46px;padding:0 18px;border-radius:23px;border:0;font-size:15px;font-weight:700}
  .regions{display:flex;flex-direction:column;gap:10px}
  .region{display:flex;align-items:center;gap:14px;padding:10px;border-radius:16px;border:2px solid transparent;background:#262A38;color:#F4F1EA;text-align:left;min-height:64px}
  .region.on{border-color:#FFC94D}
  .region i{width:52px;height:52px;border-radius:12px;flex-shrink:0}
  .region b{display:block;font-size:15px}
  .region span{font-size:12.5px;color:#C9C4B8}
  #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px calc(env(safe-area-inset-bottom) + 36px);background:linear-gradient(180deg,rgba(10,12,20,.15) 0%,rgba(10,12,20,.55) 45%,rgba(10,12,20,.92) 100%);transition:opacity .8s}
  #intro h1{margin:0 0 10px;font-family:'Nanum Pen Script',cursive;font-size:64px;font-weight:400;line-height:1}
  #intro p{margin:0 0 8px;font-size:15px;line-height:1.6;color:#E6E1D6}
  #status{display:flex;align-items:center;gap:8px;margin:14px 0 22px !important;font-size:13px !important;color:#C9C4B8 !important}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);padding:10px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:30;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c" aria-label="유리창 3D 공간"></canvas>

<div id="top">
  <button id="loc" class="glass" aria-label="지역 창 바꾸기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC94D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    <span><b id="locName">서울 마포 창</b><small id="locSub">반경 3km 안에서만 열려요</small></span>
  </button>
  <div id="topR">
    <button id="hq" class="glass iconbtn" aria-label="고화질 끄기">HD</button>
    <button id="snd" class="glass iconbtn" aria-label="소리 끄기">
      <svg id="sndOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="sndOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
    </button>
  </div>
</div>

<div id="hint" class="glass">드래그로 둘러보고 조이스틱으로 걸어요 · Space 점프 · C 앉기</div>
<div id="cross"></div>
<div id="joy" class="glass" aria-hidden="true"><div id="knob"></div></div>
<div id="acts">
  <button id="jumpBtn" class="glass act" aria-label="점프 (Space)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"/><path d="M6 20h12"/></svg>점프
  </button>
  <button id="sitBtn" class="glass act" aria-label="앉기 (C)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10l6 6 6-6"/><path d="M6 20h12"/></svg><span id="sitLabel">앉기</span>
  </button>
</div>
<button id="add">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  포스트잇 붙이기
</button>
<div id="place" class="glass">유리창을 눌러 붙일 자리를 골라요 <button id="placeCancel">취소</button></div>
<div id="toast" class="glass"></div>

<div id="composeScrim" class="scrim">
  <div class="sheet" role="dialog" aria-labelledby="composeTitle">
    <div class="row"><h2 id="composeTitle">포스트잇 쓰기</h2>
      <button class="close" data-close="composeScrim" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
    <div class="swatches" id="swatches"></div>
    <div id="edWrap"><input id="inl" type="text" maxlength="20" enterkeyhint="done" aria-label="포스트잇에 넣을 글자" style="display:none"><canvas id="ed" aria-label="포스트잇 전체 면. 펜으로 아무 곳에나 쓰거나 글자를 원하는 위치에 놓을 수 있어요"></canvas></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="도구">
        <button id="toolPen" class="on">펜</button><button id="toolText">글자</button>
      </div>
      <div id="inks" style="display:flex;gap:6px"></div>
      <div style="flex:1"></div>
      <button class="tbtn" id="undo" aria-label="되돌리기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tbtn" id="clear" aria-label="전체 지우기">비우기</button>
    </div>
    <div id="textRow">
      <div id="fonts" class="fonts" role="group" aria-label="글씨체"></div>
      <div class="seg" role="group" aria-label="글자 크기"><button data-size="s">작게</button><button data-size="m" class="on">보통</button><button data-size="l">크게</button></div>
    </div>
    <div class="row">
      <p class="muted" id="quota" style="margin:-4px 0 0;color:#FFC94D"></p>
    <p class="muted" id="edHelp">손가락으로 아무 곳에나 자유롭게 써요</p>
      <button class="tbtn" id="delSel" style="display:none;flex-shrink:0">글자 지우기</button>
    </div>
    <button class="primary" id="stick" disabled>창문에 붙이기</button>
  </div>
</div>

<div id="readerScrim" class="scrim">
  <div id="readerCard" role="dialog" aria-label="포스트잇 읽기">
    <div id="readerNote"><canvas id="readerCanvas"></canvas></div>
    <div id="readerMeta"></div>
    <div class="pillrow">
      <button class="pill" id="heartBtn" style="background:#FF9EC4;color:#3A1424">♥ 공감</button>
      <button class="pill" id="editBtn" style="background:#FFC94D;color:#1A1712;display:none">수정</button>
      <button class="pill" id="delBtn" style="background:#2A2E3C;color:#FFB4A8;display:none">떼어내기</button>
      <button class="pill" id="reportBtn" style="background:#2A2E3C;color:#FFB4A8">신고</button>
      <button class="pill" data-close="readerScrim" style="background:#2A2E3C;color:#F4F1EA">닫기</button>
    </div>
  </div>
</div>

<div id="reportScrim" class="scrim">
  <div class="sheet" role="dialog" aria-labelledby="reportTitle">
    <div class="row"><h2 id="reportTitle">이 포스트잇 신고하기</h2>
      <button class="close" data-close="reportScrim" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
    <p class="muted">신고한 포스트잇은 바로 내 화면에서 사라지고, 세 명이 신고하면 모두에게서 내려가요.</p>
    <div class="regions" id="reasons">
      <button class="region" data-reason="abuse"><div><b>욕설·비하·혐오</b><span>기분 나쁜 말이나 그림이 있어요</span></div></button>
      <button class="region" data-reason="spam"><div><b>광고·도배</b><span>홍보, 링크, 같은 내용 반복</span></div></button>
      <button class="region" data-reason="privacy"><div><b>개인정보 노출</b><span>전화번호, 실명, 주소 등</span></div></button>
      <button class="region" data-reason="sexual"><div><b>음란·불쾌한 그림</b><span>보기 불편한 그림이나 글</span></div></button>
    </div>
  </div>
</div>

<div id="regionScrim" class="scrim">
  <div class="sheet" role="dialog" aria-labelledby="regionTitle">
    <div class="row"><h2 id="regionTitle">지역 창</h2>
      <button class="close" data-close="regionScrim" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
    <p class="muted">실제 서비스에서는 내 위치 근처의 창만 열려요. 시안이라 다른 지역 창도 직접 골라볼 수 있어요.</p>
    <div class="regions" id="regions"></div>
  </div>
</div>

<div id="intro">
  <h1>유리창</h1>
  <p>우리 동네 어딘가에 서 있는 유리창.<br>근처 사람들이 남긴 포스트잇을 읽고, 한 장 붙이고 가요.</p>
  <p id="status"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFC94D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/></svg><span id="statusText">내 위치를 확인하는 중이에요…</span></p>
  <button class="primary" id="enter">창문 앞으로 가기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

function tileBox(g, w, h, d){

  for(var f=0; f<6; f++){

function wrap(ctx, text, maxW){
  var lines=[], line='';
  text.split(' ').forEach(function(word){
    var test = line? line+' '+word : word;
    if(ctx.measureText(test).width<=maxW){ line=test; return; }
    if(line){ lines.push(line); line=''; }
    var cur='';
    Array.from(word).forEach(function(ch){ if(ctx.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch; } else cur+=ch; });
    line=cur;
  });
  if(line) lines.push(line);
  return lines;
}

    x.lineTo(p[p.length-2]*S,p[p.length-1]*S); x.stroke();

  var p=edPt(e);
  if(ed.down && Math.hypot(p.x-ed.down.x, p.y-ed.down.y)>0.012) ed.down.moved=true;
  if(ed.cur){ var a=ed.cur.p, lx=a[a.length-2], ly=a[a.length-1];
    if(Math.hypot(p.x-lx,p.y-ly)>0.004){ a.push(+p.x.toFixed(3), +p.y.toFixed(3)); edDraw(); } }
  else if(ed.rot){ var t=ed.texts[ed.rot.i]; var r=Math.atan2((p.y-t.y), (p.x-t.x)) + Math.PI/2;
    var snap=Math.round(r/(Math.PI/2))*(Math.PI/2); if(Math.abs(r-snap)<0.07) r=snap; t.rot=+r.toFixed(3); edDraw(); }
  else if(ed.drag && ed.down && ed.down.moved){ var t2=ed.texts[ed.drag.i]; t2.x=+Math.min(1,Math.max(0,p.x+ed.drag.dx)).toFixed(3); t2.y=+Math.min(1,Math.max(0,p.y+ed.drag.dy)).toFixed(3); edDraw(); }
});
function edUp(e){
  var d = ed.down;
  if(ed.tool==='text' && d && !d.moved && !ed.rot){
    if(d.hit===null || d.hit===undefined){ if(ed.sel!==null && d.wasSel!==null){ ed.sel=null; edDraw(); } else openInline(d.x, d.y, null); }
    else if(d.wasSel===d.hit) openInline(0,0,d.hit);       // tap a selected text again to rewrite it
  }
  ed.cur=null; ed.drag=null; ed.rot=null; ed.down=null;
}
edC.addEventListener('pointerup', edUp); edC.addEventListener('pointercancel', function(){ ed.cur=null; ed.drag=null; ed.rot=null; ed.down=null; });
function setTool(t){
  if(ed.inl){ inl.blur(); commitInline(); }
  ed.tool=t; $('toolPen').classList.toggle('on',t==='pen'); $('toolText').classList.toggle('on',t==='text');
  $('textRow').classList.toggle('on', t==='text');
  $('edHelp').textContent = t==='pen' ? '손가락으로 아무 곳에나 자유롭게 써요' : '글자를 넣을 곳을 누르세요. 놓인 글자는 끌어서 옮기고, 위쪽 동그라미로 돌려요. 한 번 더 누르면 고쳐 써요';
  if(t==='pen'){ ed.sel=null; edDraw(); }
}
$('toolPen').addEventListener('click', function(){ setTool('pen'); });
$('toolText').addEventListener('click', function(){ setTool('text'); });
function target(){ return ed.inl ? ed.inl : (ed.sel!==null ? ed.texts[ed.sel] : null); }
Array.prototype.forEach.call(document.querySelectorAll('[data-size]'), function(b){
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });   // keep the keyboard open
  b.addEventListener('click', function(){ ed.size=b.getAttribute('data-size');
    Array.prototype.forEach.call(document.querySelectorAll('[data-size]'), function(x){ x.classList.toggle('on', x===b); });
    var t=target(); if(t){ t.s=TSIZE[ed.size]; styleInline(); edDraw(); } });
});
var fontEl = $('fonts');
FONTS.forEach(function(f){
  var b=document.createElement('button'); b.textContent=f.name; b.style.fontFamily=f.css; b.dataset.f=f.id; if(f.id===ed.font) b.className='on';
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){ ed.font=f.id; markFont(); var t=target(); if(t){ t.f=f.id; styleInline(); edDraw(); } });
  fontEl.appendChild(b);
});
function markFont(){ Array.prototype.forEach.call(fontEl.children,function(x){ x.classList.toggle('on', x.dataset.f===ed.font); }); }
$('undo').addEventListener('click', function(){ var h=ed.hist.pop(); if(h==='s') ed.strokes.pop(); else if(h==='t') ed.texts.pop(); ed.sel=null; edDraw(); });
$('clear').addEventListener('click', function(){ ed.strokes=[]; ed.texts=[]; ed.hist=[]; ed.sel=null; edDraw(); });
$('delSel').addEventListener('click', function(){
  if(ed.sel===null) return; ed.texts.splice(ed.sel,1);
  var idx=-1; for(var i=ed.hist.length-1;i>=0;i--){ if(ed.hist[i]==='t'){ idx=i; break; } } if(idx>=0) ed.hist.splice(idx,1);
  ed.sel=null; edDraw();
});
var swEl = $('swatches');
COLORS.forEach(function(c){
  var b=document.createElement('button'); b.className='sw'; b.style.background=c.hex; b.setAttribute('aria-label',c.name+' 포스트잇'); b.dataset.c=c.id;
  b.addEventListener('click', function(){ ed.c=c.id; markSw(); edDraw(); });
  swEl.appendChild(b);
});
function markSw(){ Array.prototype.forEach.call(swEl.children,function(x){ x.classList.toggle('on', x.dataset.c===ed.c); }); }
var inkEl = $('inks');
INKS.forEach(function(k){
  var b=document.createElement('button'); b.className='ink'+(k.hex===ed.ink?' on':''); b.style.background=k.hex; b.setAttribute('aria-label',k.name+' 잉크');
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){ ed.ink=k.hex; Array.prototype.forEach.call(inkEl.children,function(x){ x.classList.toggle('on', x===b); }); var t=target(); if(t){ t.c=k.hex; styleInline(); edDraw(); } });
  inkEl.appendChild(b);
});
function openComposer(mesh){
  ed.editing = mesh;
  if(mesh){ var n=mesh.userData.note; ed.c=n.c; ed.strokes=JSON.parse(JSON.stringify(n.strokes||[])); ed.texts=JSON.parse(JSON.stringify(n.texts||[])); }
  else { ed.strokes=[]; ed.texts=[]; }
  ed.hist=[]; ed.sel=null; ed.cur=null; ed.drag=null;
  $('composeTitle').textContent = mesh ? '내 포스트잇 수정' : '포스트잇 쓰기';
  $('quota').textContent = mesh ? '' : '오늘 붙일 수 있는 포스트잇 '+leftToday()+'장 남았어요 (하루 '+DAILY+'장)';
  $('stick').textContent = mesh ? '수정 완료' : '창문에 붙이기';
  inl.style.display='none'; ed.inl=null; setTool('pen'); markSw(); markFont();
  openModal('composeScrim');
  requestAnimationFrame(edResize);
}
window.addEventListener('resize', function(){ if($('composeScrim').classList.contains('on')) edResize(); });
$('stick').addEventListener('pointerdown', function(){ if(ed.inl){ inl.blur(); commitInline(); } });
$('stick').addEventListener('click', function(){
  if(ed.inl){ inl.blur(); commitInline(); }
  if(!(ed.strokes.length||ed.texts.length)) return;
  for(var bi=0; bi<ed.texts.length; bi++){ var ck=checkText(ed.texts[bi].t); ed.texts[bi].bad=!ck.ok; if(!ck.ok){ ed.sel=bi; edDraw(); toast(ck.why+' · 빨간 줄 글자를 고쳐주세요'); return; } }
  ed.sel=null;
  ed.texts.forEach(function(t){ delete t.bad; });
  var btn = $('stick');
  if(ed.editing){
    var em = ed.editing, n = em.userData.note, strokes = ed.strokes, texts = ed.texts, c = ed.c;
    if(n.server){
      btn.disabled = true;
      sbRpc('edit_note', {p_id:n.id, p_token:tokens()[n.id]||'', p_c:c, p_strokes:strokes, p_texts:texts}).then(function(){
        n.c=c; n.strokes=strokes; n.texts=texts; refreshNote(em); closeModal('composeScrim'); toast('포스트잇을 고쳤어요');
      }, function(e){ toast(e.network ? '인터넷 연결을 확인해 주세요' : serverMsg(e)); }).then(function(){ btn.disabled=false; });
      return;
    }
    n.c=c; n.strokes=strokes; n.texts=texts; refreshNote(em); saveMine();
    closeModal('composeScrim'); toast('포스트잇을 고쳤어요'); return;
  }
  if(!pending) return;
  if(leftToday()<=0){ closeModal('composeScrim'); toast('오늘은 '+DAILY+'장을 다 붙였어요. 내일 또 와요'); return; }
  var nn = {id:cfg.id+'-u'+Date.now(), c:ed.c, age:0, h:0, x:+pending.x.toFixed(3), y:+pending.y.toFixed(3), r:+((Math.random()-0.5)*0.24).toFixed(3), strokes:ed.strokes, texts:ed.texts, mine:true};
  var region = cfg.id;
  function keepLocal(msg){ useOne(); addNoteMesh(nn, noteMeshes.length); saveMine(); closeModal('composeScrim'); toast(msg); }
  btn.disabled = true;
  sbRpc('post_note', {p_device:deviceId(), p_region:region, p_x:nn.x, p_y:nn.y, p_r:nn.r, p_c:nn.c, p_strokes:nn.strokes, p_texts:nn.texts}).then(function(res){
    useOne(); setToken(res.id, res.token);
    if(region===cfg.id){ nn.id = res.id; nn.server = true; addNoteMesh(nn, noteMeshes.length); }
    if(typeof res.left==='number'){ var u = store.get('yurichang-day'); store.set('yurichang-day', {d:today(), n:Math.max(DAILY-res.left, u&&u.d===today()?u.n:0)}); }
    closeModal('composeScrim'); toast(cfg.name+' 창에 붙였어요 · 오늘 '+leftToday()+'장 남았어요');
  }, function(e){
    if(e.network) keepLocal('연결이 안 돼서 내 휴대폰에만 붙였어요');
    else { if(e.message && e.message.indexOf('daily_limit')>=0) store.set('yurichang-day', {d:today(), n:DAILY}); toast(serverMsg(e)); }
  }).then(function(){ btn.disabled = false; edState(); });
});

// ---------- reader ----------
var reading = null, rC = $('readerCanvas');
function drawReader(){
  var n = reading.userData.note, S = Math.round($('readerNote').getBoundingClientRect().width)||300;
  rC.width=S*DPR; rC.height=S*DPR; var x=rC.getContext('2d'); x.setTransform(DPR,0,0,DPR,0,0);
  renderNote(x, n, S, {deco:false});
  if(n.age>0.6){ x.fillStyle='rgba(255,255,255,.3)'; x.fillRect(0,0,S,S); }
}
function openReader(mesh){
  reading = mesh; var n = mesh.userData.note;
  openModal('readerScrim');
  requestAnimationFrame(drawReader);
  $('readerMeta').textContent = (n.mine?'내가 붙인 포스트잇 · ':'')+(n.age>0.6?'오래전에 붙은 포스트잇 · ':'')+'♥ '+(n.h||0);
  $('heartBtn').textContent = n.liked ? '♥ 공감했어요' : '♥ 공감';
  $('heartBtn').style.display = n.mine ? 'none' : '';
  $('editBtn').style.display = n.mine ? '' : 'none';
  $('delBtn').style.display = n.mine ? '' : 'none';
  $('reportBtn').style.display = n.mine ? 'none' : '';
}
$('heartBtn').addEventListener('click', function(){
  if(!reading) return; var n = reading.userData.note; if(n.liked) return;
  n.liked=true; n.h=(n.h||0)+1;
  var hs = store.get('yurichang-h:'+cfg.id)||{}; hs[n.id]=1; store.set('yurichang-h:'+cfg.id, hs);
  var hm = reading;
  if(n.server) sbRpc('heart_note', {p_id:n.id, p_device:deviceId()}).then(function(cnt){ if(typeof cnt==='number'){ n.h=cnt; refreshNote(hm); } }, function(){});
  refreshNote(reading);
  $('heartBtn').textContent='♥ 공감했어요'; $('readerMeta').textContent='♥ '+n.h;
});
$('editBtn').addEventListener('click', function(){ var m=reading; closeModal('readerScrim'); openComposer(m); });
var delArm = false;
$('delBtn').addEventListener('click', function(){
  if(!delArm){ delArm=true; $('delBtn').textContent='한 번 더 누르면 떼어내요'; setTimeout(function(){ delArm=false; $('delBtn').textContent='떼어내기'; },2500); return; }
  delArm=false; $('delBtn').textContent='떼어내기';
  var m=reading, n=m.userData.note;
  function drop(){ world.remove(m); m.geometry.dispose(); m.material.map.dispose(); m.material.dispose(); noteMeshes.splice(noteMeshes.indexOf(m),1); saveMine(); closeModal('readerScrim'); toast('포스트잇을 떼어냈어요'); }
  if(n.server){ sbRpc('delete_note', {p_id:n.id, p_token:tokens()[n.id]||''}).then(function(){ setToken(n.id, null); drop(); }, function(e){ toast(e.network ? '인터넷 연결을 확인해 주세요' : serverMsg(e)); }); return; }
  drop();
});

$('reportBtn').addEventListener('click', function(){ closeModal('readerScrim'); openModal('reportScrim'); });
Array.prototype.forEach.call(document.querySelectorAll('[data-reason]'), function(b){
  b.addEventListener('click', function(){
    var m = reading; if(!m) return;
    var hid = store.get(hiddenKey())||{}; hid[m.userData.note.id] = b.getAttribute('data-reason'); store.set(hiddenKey(), hid);
    if(m.userData.note.server) sbRpc('report_note', {p_id:m.userData.note.id, p_device:deviceId(), p_reason:b.getAttribute('data-reason')}).catch(function(){});
    world.remove(m); noteMeshes.splice(noteMeshes.indexOf(m),1);
    closeModal('reportScrim'); toast('신고했어요. 이 포스트잇은 이제 안 보여요');
  });
});

// ---------- regions ----------
var regEl = $('regions');
function renderRegions(){
  regEl.innerHTML='';
  REGIONS.forEach(function(r){
    var b=document.createElement('button'); b.className='region'+(r.id===cfg.id?' on':'');
    var i=document.createElement('i'); i.style.background='linear-gradient(180deg,'+r.sky[0]+','+r.sky[1]+' 70%,'+r.ground+' 70%)';
    var s=document.createElement('div'); var bb=document.createElement('b'); bb.textContent=r.name+' 창'; var sp=document.createElement('span'); sp.textContent=r.scene+' · 포스트잇 '+(r.notes.length+((store.get('yurichang2:'+r.id)||[]).length))+'장';
    s.appendChild(bb); s.appendChild(sp); b.appendChild(i); b.appendChild(s);
    b.addEventListener('click', function(){ goRegion(r); closeModal('regionScrim'); });
    regEl.appendChild(b);
  });
}
$('loc').addEventListener('click', function(){ renderRegions(); openModal('regionScrim'); });
function goRegion(r){ cfg=r; player.x=0; player.z=5.2; player.yaw=0; player.pitch=0.04; player.sit=player.crouch=false; updateSitLabel(); build(); setAmbience(); toast(r.name+' 창으로 왔어요'); }

// ---------- graphics quality ----------
function markHQ(){ var b=$('hq'); b.classList.toggle('off', !hq); b.setAttribute('aria-label', hq?'고화질 끄기':'고화질 켜기'); }
markHQ();
$('hq').addEventListener('click', function(){ hq=!hq; store.set('yurichang-hq', hq); markHQ(); build(); toast(hq?'고화질: 그림자·빛 번짐 켜짐':'가벼운 화질로 바꿨어요'); });

// ---------- ambience ----------
var actx=null, gainN=null, lfo=null, soundOn=true, filt=null;
function startSound(){
  if(actx) return;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    var len = actx.sampleRate*4, buf = actx.createBuffer(1,len,actx.sampleRate), d = buf.getChannelData(0), last=0;
    for(var i=0;i<len;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    var src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
    filt = actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=600;
    gainN = actx.createGain(); gainN.gain.value=0.0;
    lfo = actx.createOscillator(); var lg = actx.createGain(); lfo.frequency.value=0.09; lg.gain.value=0.12; lfo.connect(lg); lg.connect(gainN.gain);
    src.connect(filt); filt.connect(gainN); gainN.connect(actx.destination); src.start(); lfo.start();
    setAmbience();
  }catch(e){ actx=null; }
}
function setAmbience(){
  if(!actx||!gainN) return;
  var sea = cfg.water==='sea'||cfg.water==='farsea';
  filt.frequency.setTargetAtTime(sea?900:480, actx.currentTime, 0.5);
  lfo.frequency.setTargetAtTime(sea?0.11:0.05, actx.currentTime, 0.5);
  gainN.gain.setTargetAtTime(soundOn?(sea?0.22:0.16):0, actx.currentTime, 0.4);
}
$('snd').addEventListener('click', function(){
  soundOn=!soundOn; startSound(); setAmbience();
  $('sndOn').style.display=soundOn?'':'none'; $('sndOff').style.display=soundOn?'none':'';
  $('snd').setAttribute('aria-label', soundOn?'소리 끄기':'소리 켜기');
});

// ---------- location ----------
function nearest(lat,lng){ var best=REGIONS[0],bd=1e9; REGIONS.forEach(function(r){ var d=Math.hypot(r.lat-lat,(r.lng-lng)*Math.cos(lat*Math.PI/180)); if(d<bd){bd=d;best=r;} }); return best; }
var located = false;
function locFail(){ if(located) return; located=true; $('statusText').textContent='위치를 확인할 수 없어 서울 마포 창으로 안내할게요. 위쪽에서 바꿀 수 있어요.'; }
try{
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      if(located) return; located=true; var r=nearest(p.coords.latitude,p.coords.longitude);
      if(r.id!==cfg.id){ cfg=r; build(); }
      $('statusText').textContent='가까운 창을 찾았어요: '+r.name+' 창 (반경 3km)';
    }, locFail, {timeout:4000, maximumAge:600000});
    setTimeout(locFail, 4500);
  } else locFail();
}catch(e){ locFail(); }

$('enter').addEventListener('click', function(){
  var i=$('intro'); i.style.opacity=0; setTimeout(function(){ i.style.display='none'; },800);
  startSound();
  setTimeout(hideHint, 8000);
});

// ---------- loop ----------
window.addEventListener('resize', function(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); if(composer) composer.setSize(window.innerWidth,window.innerHeight); });
var clock = new THREE.Clock(), introYaw = 0, perf = {n:0, sum:0, checked:false};
function frame(){
  var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  var f = 0, s = 0;
  if(!modal){
    if(keys['w']||keys['arrowup']) f+=1; if(keys['s']||keys['arrowdown']) f-=1;
    if(keys['d']||keys['arrowright']) s+=1; if(keys['a']||keys['arrowleft']) s-=1;
  }
  f += -joy.y; s += joy.x;
  var len = Math.hypot(f,s); if(len>1){ f/=len; s/=len; }
  if(player.sit && len>0.25){ standUp(); }
  if(player.sit){ f=s=0; player.x += (BENCH.x-player.x)*Math.min(1,dt*6); player.z += (BENCH.z+0.05-player.z)*Math.min(1,dt*6); }
  var sp = player.crouch ? 1.1 : 2.3, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  var tvx = (-sy*f + cy*s)*sp, tvz = (-cy*f - sy*s)*sp;
  var air = grounded() ? 8 : 2.5;
  player.vx += (tvx-player.vx)*Math.min(1,dt*air); player.vz += (tvz-player.vz)*Math.min(1,dt*air);
  if(!player.sit){
    var nx = player.x+player.vx*dt, nz = player.z+player.vz*dt;
    if(!blocked(nx,player.z)) player.x=nx; else player.vx=0;
    if(!blocked(player.x,nz)) player.z=nz; else player.vz=0;
  }
  player.vy -= 13*dt; player.jy += player.vy*dt; if(player.jy<0){ player.jy=0; player.vy=0; }
  var eyeT = player.sit ? 1.12 : player.crouch ? 0.95 : 1.6;
  player.eye += (eyeT-player.eye)*Math.min(1,dt*7);
  var spd = grounded() ? Math.hypot(player.vx,player.vz) : 0; player.bob += spd*dt*3.2;
  var intro = $('intro').style.display!=='none';
  if(intro){ introYaw = Math.sin(t*0.15)*0.12; }
  camera.position.set(player.x, baseY(player.x,player.z)+player.eye+player.jy+Math.sin(player.bob)*0.025*Math.min(1,spd), player.z);
  camera.rotation.set(player.pitch, player.yaw+(intro?introYaw:0), 0);
  for(var i=0;i<uniformsList.length;i++) if(uniformsList[i].t) uniformsList[i].t.value=t;
  WIND.value = t;
  if(hq && composer) composer.render(); else renderer.render(scene, camera);
  // drop to light mode automatically if the phone struggles
  if(hq && !perf.checked && !intro){ perf.n++; perf.sum+=dt; if(perf.n>=180){ perf.checked=true; if(perf.sum/perf.n>0.034){ hq=false; markHQ(); build(); toast('화면이 버벅여서 가벼운 화질로 바꿨어요'); } } }
  requestAnimationFrame(frame);
}

function boot(){ build(); frame(); loadNature(); }
var fontWait = document.fonts && document.fonts.load ? Promise.race([Promise.all(FONTS.map(function(f){ return document.fonts.load('40px '+f.css.split(',')[0]); })), new Promise(function(r){ setTimeout(r,3000); })]) : Promise.resolve();
fontWait.then(boot, boot);
})();
</script>
